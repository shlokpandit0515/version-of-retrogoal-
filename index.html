<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Retro Soccer Prototype</title>
    <style>
        body {
            margin: 0;
            background: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: white;
            font-family: Arial, sans-serif;
        }

        canvas {
            border: 4px solid #fff;
            background: #2e7d32;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" width="800" height="500"></canvas>

    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let score = 0;
        let message = "";
        let messageTimer = 0;

        const player = {
            x: 200,
            y: 250,
            radius: 15,
            speed: 4,
            color: "#0d47a1"
        };

        const enemy = {
            x: 600,
            y: 250,
            radius: 15,
            speed: 2.2,
            color: "#b71c1c"
        };

        const ball = {
            x: 400,
            y: 250,
            radius: 10,
            vx: 0,
            vy: 0,
            friction: 0.985,
            color: "#fff"
        };

        const goal = {
            x: canvas.width - 20,
            y: 175,
            width: 20,
            height: 150
        };

        const keys = {};

        window.addEventListener("keydown", (e) => {
            keys[e.key] = true;
        });

        window.addEventListener("keyup", (e) => {
            keys[e.key] = false;
        });

        function showMessage(text) {
            message = text;
            messageTimer = 1.2;
        }

        function resetBall() {
            ball.x = canvas.width / 2;
            ball.y = canvas.height / 2;
            ball.vx = 0;
            ball.vy = 0;
            player.x = 200;
            player.y = 250;
            enemy.x = 600;
            enemy.y = 250;
        }

        function keepInside(entity) {
            entity.x = Math.max(entity.radius, Math.min(canvas.width - entity.radius, entity.x));
            entity.y = Math.max(entity.radius, Math.min(canvas.height - entity.radius, entity.y));
        }

        function movePlayer() {
            if (keys["ArrowUp"] || keys["w"]) player.y -= player.speed;
            if (keys["ArrowDown"] || keys["s"]) player.y += player.speed;
            if (keys["ArrowLeft"] || keys["a"]) player.x -= player.speed;
            if (keys["ArrowRight"] || keys["d"]) player.x += player.speed;

            keepInside(player);
        }

        function moveEnemy() {
            const dx = ball.x - enemy.x;
            const dy = ball.y - enemy.y;
            const distance = Math.hypot(dx, dy);

            if (distance > 0) {
                enemy.x += (dx / distance) * enemy.speed;
                enemy.y += (dy / distance) * enemy.speed;
            }

            keepInside(enemy);
        }

        function kickBallFrom(entity) {
            const dx = ball.x - entity.x;
            const dy = ball.y - entity.y;
            const distance = Math.hypot(dx, dy);
            const minDistance = entity.radius + ball.radius + 2;

            if (distance < minDistance) {
                const angle = Math.atan2(dy, dx);
                const force = 6;
                ball.vx = Math.cos(angle) * force;
                ball.vy = Math.sin(angle) * force;
            }
        }

        function updateBall() {
            ball.x += ball.vx;
            ball.y += ball.vy;

            ball.vx *= ball.friction;
            ball.vy *= ball.friction;

            if (Math.abs(ball.vx) < 0.02) ball.vx = 0;
            if (Math.abs(ball.vy) < 0.02) ball.vy = 0;

            if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
                ball.y = Math.max(ball.radius, Math.min(canvas.height - ball.radius, ball.y));
                ball.vy *= -1;
            }

            if (ball.x - ball.radius < 0) {
                ball.x = ball.radius;
                ball.vx *= -0.9;
            }

            const inGoalOpening = ball.y >= goal.y && ball.y <= goal.y + goal.height;
            if (ball.x + ball.radius >= goal.x && inGoalOpening) {
                score++;
                showMessage("GOAL!");
                resetBall();
                return;
            }

            if (ball.x + ball.radius > canvas.width) {
                ball.x = canvas.width - ball.radius;
                ball.vx *= -0.9;
            }
        }

        function update() {
            movePlayer();
            moveEnemy();
            kickBallFrom(player);
            kickBallFrom(enemy);
            updateBall();

            if (messageTimer > 0) {
                messageTimer -= 1 / 60;
            }
        }

        function drawPitch() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.strokeStyle = "rgba(255,255,255,0.3)";
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.moveTo(canvas.width / 2, 0);
            ctx.lineTo(canvas.width / 2, canvas.height);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(canvas.width / 2, canvas.height / 2, 70, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = "rgba(255,255,255,0.9)";
            ctx.fillRect(goal.x, goal.y, goal.width, goal.height);
        }

        function drawEntity(entity, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.arc(entity.x, entity.y, entity.radius, 0, Math.PI * 2);
            ctx.fill();
        }

        function draw() {
            drawPitch();
            drawEntity(player, player.color);
            drawEntity(enemy, enemy.color);
            drawEntity(ball, ball.color);

            ctx.fillStyle = "white";
            ctx.font = "20px Arial";
            ctx.fillText("Score: " + score, 20, 40);

            if (messageTimer > 0) {
                ctx.fillStyle = "rgba(255,255,255,0.95)";
                ctx.font = "bold 28px Arial";
                const textWidth = ctx.measureText(message).width;
                ctx.fillText(message, canvas.width / 2 - textWidth / 2, 70);
            }
        }

        function loop() {
            update();
            draw();
            requestAnimationFrame(loop);
        }

        loop();
    </script>
</body>
</html>
